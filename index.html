```html
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoutDown</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
    min-height: 100vh;
}

/* =========================
   MENU DES RÉGLAGES
========================= */

#settingsScreen {
    width: 100%;
    max-width: 700px;
    margin: auto;
    padding: 30px;
    text-align: center;
}

h1 {
    font-size: 45px;
    margin-bottom: 35px;
}

.settings {
    background: white;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 5px 25px rgba(0,0,0,.1);
}

label {
    display: block;
    font-size: 18px;
    margin-top: 20px;
    margin-bottom: 8px;
    text-align: left;
}

input {
    width: 100%;
    padding: 14px;
    font-size: 20px;
    border: 2px solid #ddd;
    border-radius: 10px;
    outline: none;
}

input:focus {
    border-color: #777;
}

button {
    border: none;
    border-radius: 10px;
    padding: 14px 25px;
    font-size: 19px;
    cursor: pointer;
    font-weight: bold;
}

#startBtn {
    margin-top: 30px;
    width: 100%;
    background: #2684ff;
    color: white;
}

#startBtn:hover {
    background: #1769d1;
}

/* =========================
   ÉCRAN TIMER
========================= */

#timerScreen {
    display: none;
    width: 100%;
    min-height: 100vh;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    position: relative;
}

#settingsBtn {
    position: fixed;
    top: 20px;
    left: 20px;
    background: white;
    color: #222;
    box-shadow: 0 3px 12px rgba(0,0,0,.15);
    padding: 10px 15px;
    font-size: 16px;
}

#timer {
    font-size: clamp(100px, 25vw, 250px);
    font-weight: bold;
    line-height: 1;
}

#secondsText {
    font-size: 25px;
    margin-top: 20px;
}

#skipBtn,
#delaySkipBtn {
    margin-top: 40px;
    background: #ffb000;
    color: white;
}

/* =========================
   STREAM DELAY
========================= */

#streamDelayScreen {
    display: none;
    width: 100%;
    min-height: 100vh;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    text-align: center;
}

#streamDelayTitle {
    color: #e00000;
    font-size: clamp(50px, 10vw, 100px);
    font-weight: 900;
    margin-bottom: 25px;
}

#delayTimer {
    font-size: clamp(100px, 25vw, 230px);
    font-weight: bold;
}

#delaySeconds {
    font-size: 25px;
    margin-top: 10px;
}

/* =========================
   QUESTION
========================= */

#questionScreen {
    display: none;
    width: 100%;
    min-height: 100vh;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    text-align: center;
}

#questionScreen h2 {
    font-size: clamp(35px, 7vw, 70px);
    margin: 0 20px 40px;
}

.answerButtons {
    display: flex;
    gap: 20px;
}

#yesBtn {
    background: #22b573;
    color: white;
}

#noBtn {
    background: #e00000;
    color: white;
}

/* =========================
   ANIMATION
========================= */

.warning {
    color: #e00000 !important;
}

.pulse {
    animation: pulse .5s infinite alternate;
}

@keyframes pulse {
    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.06);
    }
}

@media (max-width: 600px) {

    .answerButtons {
        flex-direction: column;
        width: 80%;
    }

    .answerButtons button {
        width: 80%;
    }
}
</style>
</head>

<body>

<!-- =========================
     MENU RÉGLAGES
========================= -->

<div id="settingsScreen">

    <h1>🎮 Kahoot Down</h1>

    <div class="settings">

        <label for="startTime">
            Temps de départ
        </label>

        <input
            id="startTime"
            type="number"
            min="1"
            value="30"
        >

        <label for="skipTime">
            Temps du bouton « Passer à »
        </label>

        <input
            id="skipTime"
            type="number"
            min="1"
            value="15"
        >

        <label for="alarmTime">
            Stream Delay
        </label>

        <input
            id="alarmTime"
            type="number"
            min="1"
            value="7"
        >

        <button id="startBtn">
            START
        </button>

    </div>
</div>


<!-- =========================
     TIMER PRINCIPAL
========================= -->

<div id="timerScreen">

    <button id="settingsBtn">
        ⚙️
    </button>

    <div id="timer">
        30
    </div>

    <div id="secondsText">
        secondes
    </div>

    <button id="skipBtn">
        ⏩ Passer à 15
    </button>

</div>


<!-- =========================
     STREAM DELAY
========================= -->

<div id="streamDelayScreen">

    <div id="streamDelayTitle">
        STREAM DELAY
    </div>

    <div id="delayTimer">
        7
    </div>

    <div id="delaySeconds">
        secondes
    </div>

    <button id="delaySkipBtn">
        ⏩ Passer à 15
    </button>

</div>


<!-- =========================
     QUESTION
========================= -->

<div id="questionScreen">

    <h2>
        Est-ce qu'il y a eu plus d'argent ?
    </h2>

    <div class="answerButtons">

        <button id="yesBtn">
            OUI
        </button>

        <button id="noBtn">
            NON
        </button>

    </div>

</div>


<script>

/* =========================
   ÉLÉMENTS
========================= */

const settingsScreen =
    document.getElementById("settingsScreen");

const timerScreen =
    document.getElementById("timerScreen");

const streamDelayScreen =
    document.getElementById("streamDelayScreen");

const questionScreen =
    document.getElementById("questionScreen");

const startTimeInput =
    document.getElementById("startTime");

const skipTimeInput =
    document.getElementById("skipTime");

const alarmTimeInput =
    document.getElementById("alarmTime");

const startBtn =
    document.getElementById("startBtn");

const settingsBtn =
    document.getElementById("settingsBtn");

const skipBtn =
    document.getElementById("skipBtn");

const delaySkipBtn =
    document.getElementById("delaySkipBtn");

const yesBtn =
    document.getElementById("yesBtn");

const noBtn =
    document.getElementById("noBtn");

const timer =
    document.getElementById("timer");

const secondsText =
    document.getElementById("secondsText");

const delayTimer =
    document.getElementById("delayTimer");

const delaySeconds =
    document.getElementById("delaySeconds");


/* =========================
   VARIABLES
========================= */

let timerTimeout = null;
let delayTimeout = null;

let currentTime = 0;
let currentDelay = 0;


/* =========================
   SON
========================= */

function beep(frequency = 700, duration = 180) {

    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

    if (!AudioContext) return;

    const audio = new AudioContext();

    const oscillator =
        audio.createOscillator();

    const gain =
        audio.createGain();

    oscillator.frequency.value = frequency;
    oscillator.type = "square";

    gain.gain.value = 0.12;

    oscillator.connect(gain);
    gain.connect(audio.destination);

    oscillator.start();

    setTimeout(() => {
        oscillator.stop();
        audio.close();
    }, duration);
}


/* =========================
   AFFICHAGE TIMER
========================= */

function updateTimer() {

    timer.textContent = currentTime;

    if (currentTime <= 1) {
        secondsText.textContent = "seconde";
    } else {
        secondsText.textContent = "secondes";
    }

    /*
       Dernières 10 secondes :
       rouge
    */

    if (currentTime <= 10) {
        timer.classList.add("warning");
    } else {
        timer.classList.remove("warning");
    }

    /*
       Dernières 5 secondes :
       animation
    */

    if (currentTime <= 5) {
        timer.classList.add("pulse");
    } else {
        timer.classList.remove("pulse");
    }
}


/* =========================
   DÉMARRER TIMER
========================= */

function startTimer() {

    clearTimeout(timerTimeout);
    clearTimeout(delayTimeout);

    currentTime =
        Math.max(
            1,
            parseInt(startTimeInput.value) || 30
        );

    settingsScreen.style.display = "none";
    streamDelayScreen.style.display = "none";
    questionScreen.style.display = "none";

    timerScreen.style.display = "flex";

    timer.style.display = "block";
    secondsText.style.display = "block";
    skipBtn.style.display = "inline-block";

    updateTimer();

    /*
       On attend une seconde avant
       de passer au chiffre suivant.
    */

    scheduleNextTick();
}


/* =========================
   COMPTE À REBOURS
========================= */

function scheduleNextTick() {

    clearTimeout(timerTimeout);

    /*
       Vitesse normale :
       1 seconde réelle = 1 chiffre
    */

    let delay = 1000;

    /*
       De 10 à 6 :
       1 chiffre toutes les 1,5 secondes
    */

    if (currentTime <= 10 && currentTime > 5) {
        delay = 1500;
    }

    /*
       De 5 à 0 :
       1 chiffre toutes les 2 secondes
    */

    if (currentTime <= 5 && currentTime > 0) {
        delay = 2000;
    }

    timerTimeout = setTimeout(() => {

        currentTime--;

        if (currentTime < 0) {
            currentTime = 0;
        }

        updateTimer();

        /*
           Bip pendant les 10 dernières secondes.
        */

        if (currentTime <= 10 && currentTime > 0) {
            beep(600, 100);
        }

        /*
           Arrivé à 0 :
           Stream Delay.
        */

        if (currentTime === 0) {

            startStreamDelay();

            return;
        }

        /*
           Sinon on continue avec
           le chiffre suivant.
        */

        scheduleNextTick();

    }, delay);
}


/* =========================
   PASSER À X SECONDES
========================= */

function skipToSelectedTime() {

    const skipTime =
        Math.max(
            1,
            parseInt(skipTimeInput.value) || 15
        );

    clearTimeout(timerTimeout);

    currentTime = skipTime;

    updateTimer();

    beep(800, 150);

    scheduleNextTick();
}

skipBtn.addEventListener(
    "click",
    skipToSelectedTime
);


/* =========================
   STREAM DELAY
========================= */

function startStreamDelay() {

    clearTimeout(timerTimeout);
    clearTimeout(delayTimeout);

    timerScreen.style.display = "none";
    questionScreen.style.display = "none";

    streamDelayScreen.style.display = "flex";

    currentDelay =
        Math.max(
            1,
            parseInt(alarmTimeInput.value) || 7
        );

    updateDelay();

    scheduleDelayTick();
}


/* =========================
   STREAM DELAY TIMER
========================= */

function scheduleDelayTick() {

    clearTimeout(delayTimeout);

    delayTimeout = setTimeout(() => {

        currentDelay--;

        updateDelay();

        beep(500, 120);

        if (currentDelay <= 0) {

            showQuestion();

            return;
        }

        scheduleDelayTick();

    }, 1000);
}


/* =========================
   AFFICHAGE STREAM DELAY
========================= */

function updateDelay() {

    delayTimer.textContent = currentDelay;

    if (currentDelay <= 1) {
        delaySeconds.textContent = "seconde";
    } else {
        delaySeconds.textContent = "secondes";
    }
}


/* =========================
   PASSER LE STREAM DELAY
========================= */

delaySkipBtn.addEventListener(
    "click",
    () => {

        clearTimeout(delayTimeout);

        const skipTime =
            Math.max(
                1,
                parseInt(skipTimeInput.value) || 15
            );

        currentTime = skipTime;

        streamDelayScreen.style.display = "none";
        questionScreen.style.display = "none";

        timerScreen.style.display = "flex";

        timer.style.display = "block";
        secondsText.style.display = "block";
        skipBtn.style.display = "inline-block";

        updateTimer();

        beep(800, 150);

        scheduleNextTick();
    }
);


/* =========================
   QUESTION
========================= */

function showQuestion() {

    clearTimeout(delayTimeout);

    streamDelayScreen.style.display = "none";

    questionScreen.style.display = "flex";

    beep(900, 300);
}


/* =========================
   OUI
========================= */

yesBtn.addEventListener(
    "click",
    () => {

        const skipTime =
            Math.max(
                1,
                parseInt(skipTimeInput.value) || 15
            );

        currentTime = skipTime;

        questionScreen.style.display = "none";

        timerScreen.style.display = "flex";

        timer.style.display = "block";
        secondsText.style.display = "block";
        skipBtn.style.display = "inline-block";

        updateTimer();

        beep(900, 150);

        scheduleNextTick();
    }
);


/* =========================
   NON
========================= */

noBtn.addEventListener(
    "click",
    () => {

        clearTimeout(timerTimeout);
        clearTimeout(delayTimeout);

        questionScreen.style.display = "none";
        timerScreen.style.display = "none";
        streamDelayScreen.style.display = "none";

        /*
           Retour au menu des réglages.
        */

        settingsScreen.style.display = "block";

        beep(300, 200);
    }
);


/* =========================
   BOUTON RÉGLAGES
========================= */

settingsBtn.addEventListener(
    "click",
    () => {

        clearTimeout(timerTimeout);
        clearTimeout(delayTimeout);

        timerScreen.style.display = "none";
        streamDelayScreen.style.display = "none";
        questionScreen.style.display = "none";

        settingsScreen.style.display = "block";
    }
);


/* =========================
   START
========================= */

startBtn.addEventListener(
    "click",
    () => {

        /*
           Dès que START est pressé,
           le menu disparaît.
        */

        settingsScreen.style.display = "none";

        startTimer();
    }
);


/* =========================
   INITIALISATION
========================= */

currentTime =
    parseInt(startTimeInput.value) || 30;

currentDelay =
    parseInt(alarmTimeInput.value) || 7;

updateTimer();
updateDelay();

</script>

</body>
</html>
